<!DOCTYPE html>
<html>
<head>
  <title>Career Salary Simulator</title>
  <style>
    body { font-family: sans-serif; max-width: 700px; margin: 40px auto; }
    select { font-size: 16px; padding: 6px; margin-bottom: 20px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid #ddd; }
    .positive { color: green; }
    .negative { color: red; }
    .roi-box { background: #f5f5f5; padding: 16px; border-radius: 8px; margin: 20px 0; }
    .roi-box p { margin: 4px 0; }
    #summaryBox { background: #eef6ff; padding: 16px; border-radius: 8px; margin: 20px 0; min-height: 20px; }
    button { font-size: 15px; padding: 8px 16px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Career Salary Simulator</h1>

  <label for="major">Choose your major: </label>
  <select id="major">
    <option value="Computer Science">Computer Science</option>
    <option value="Information Systems">Information Systems</option>
  </select>

  <div class="roi-box">
    <p>Average starting salary: <strong id="baseline">--</strong></p>
    <p>Average net cost: <strong id="cost">--</strong></p>
    <p>Average loans: <strong id="loans">--</strong></p>
    <p>Estimated payback period: <strong id="payback">--</strong></p>
  </div>

  <button onclick="getSummary()">Get AI Summary</button>
  <div id="summaryBox"></div>

  <h2>Certifications ranked by salary lift</h2>
  <table id="certTable">
    <tr><th>Certification</th><th>Lift</th><th>Sample size</th></tr>
  </table>

  <script>
        let GEMINI_API_KEY = localStorage.getItem("gemini_key");
    if (!GEMINI_API_KEY) {
      GEMINI_API_KEY = prompt("Enter your Gemini API key:");
      localStorage.setItem("gemini_key", GEMINI_API_KEY);
    }
    let data = null;
    let sortedCerts = [];

    fetch("results.json")
      .then(response => response.json())
      .then(json => {
        data = json;
        updatePage();
      });

    document.getElementById("major").addEventListener("change", updatePage);

    function updatePage() {
      if (!data) return;

      const major = document.getElementById("major").value;
      const baseline = data.baseline_by_major[major];
      document.getElementById("baseline").textContent = "$" + baseline.toLocaleString();

      const roi = data.roi_by_major[major];
      document.getElementById("cost").textContent = "$" + roi.avg_net_cost.toLocaleString();
      document.getElementById("loans").textContent = "$" + roi.avg_loans.toLocaleString();
      document.getElementById("payback").textContent = roi.avg_payback_years + " years";

      const table = document.getElementById("certTable");
      table.innerHTML = "<tr><th>Certification</th><th>Lift</th><th>Sample size</th></tr>";

      sortedCerts = Object.entries(data.certifications);
      sortedCerts.sort((a, b) => b[1].lift - a[1].lift);

      for (const [name, info] of sortedCerts) {
        const row = table.insertRow();
        row.insertCell(0).textContent = name;
        const liftCell = row.insertCell(1);
        liftCell.textContent = (info.lift >= 0 ? "+$" : "-$") + Math.abs(info.lift).toLocaleString();
        liftCell.className = info.lift >= 0 ? "positive" : "negative";
        row.insertCell(2).textContent = info.n;
      }

      document.getElementById("summaryBox").textContent = "";
    }

    async function getSummary() {
      const major = document.getElementById("major").value;
      const topCert = sortedCerts[0];
      const roi = data.roi_by_major[major];

      const prompt = `In one encouraging sentence, tell a ${major} student that earning the "${topCert[0]}" certification is associated with a $${topCert[1].lift.toFixed(0)} salary increase, and their degree has an estimated payback period of ${roi.avg_payback_years} years. Be specific and motivating, no more than 2 sentences.`;

      document.getElementById("summaryBox").textContent = "Thinking...";

      try {
        const response = await fetch(
          `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent`,
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "x-goog-api-key": GEMINI_API_KEY
            },
            body: JSON.stringify({
              contents: [{ parts: [{ text: prompt }] }]
            })
          }
        );
        const result = await response.json();
        const text = result.candidates[0].content.parts[0].text;
        document.getElementById("summaryBox").textContent = text;
      } catch (err) {
        document.getElementById("summaryBox").textContent = "Couldn't reach Gemini API — check the console for details.";
        console.error(err);
      }
    }
  </script>
</body>
</html>
